[llm]
base_url = "http://127.0.0.1:11434/v1"
model = "qwen3.8:27b-mlx"
temperature = 0.2
call_timeout = 3600
# Hard output cap (Ollama: num_predict). Even a stuck thinking model
# now stops with finish_reason=length instead of running to the timeout.
max_tokens = 16000

[observe]
# Record every model request/response for `khorek traces`.
enabled = true
keep_runs = 50

[defaults]
max_issues_per_file = 3
max_file_bytes = 200000
max_prompt_bytes = 400000
max_tool_output_bytes = 16000
max_cycles = 25

[agents.aspect]
reasoning_effort = "low"
max_handoffs = 3
max_tool_calls = 20

[agents.explorer]
reasoning_effort = "low"
max_tool_calls = 20

[agents.fixer]
reasoning_effort = "low"
max_attempts = 5
max_tool_calls = 20

[agents.verifier]
reasoning_effort = "none"

[agents.reviewer]
reasoning_effort = "low"
max_handoffs = 2
max_tool_calls = 20

# Run in order, first failure is reported back to the Fixer.
# Commands must be non-mutating checks: the harness does not restore side
# effects they leave behind, only the files the Fixer touched.
[[verify]]
cmd = "uv run ruff format --check ."
timeout = 120

[[verify]]
cmd = "uv run pytest -q"
timeout = 600

[[aspects]]
id = "comments"
prompt = """
Look at the comments and find those that are out of sync or contain
inconsistencies, or that are redundant — restating what the code already says or
adding no new information. Assume the code is correct."""
files = ["src/**/*.py", "tests/*.py"]
max_issues_per_file = 2

[[aspects]]
id = "documentation"
prompt = """
Review the documentation file. Check every factual claim it makes about the
codebase — commands, flags, config keys, defaults, etc. — against the actual
code. Report only claims the code factually contradicts: stale names, wrong
commands or flags, incorrect defaults, or references to code that no longer
exists. Verify each suspect claim by reading the relevant code before
reporting; never report based on the document alone. Do not report features
that are missing or under-documented, and do not report wording or style
preferences. Assume the code is correct."""
files = ["README.md", "docs/*.md", "AGENTS.md"]
max_issues_per_file = 2
