[llm]
base_url = "http://127.0.0.1:11434/v1"
model = "qwen3.8:27b-mxfp8"
think = true
temperature = 0.2
call_timeout = 600
# Hard output cap (Ollama: num_predict). Even with think = true a stuck model
# now stops with finish_reason=length instead of running to the timeout.
max_tokens = 8192

[observe]
# Record every model request/response for `khorek traces`.
enabled = true
keep_runs = 50

[defaults]
max_issues_per_file = 3
max_file_bytes = 200000
max_prompt_bytes = 400000
max_tool_output_bytes = 16000
max_cycles = 25

[agents.aspect]
prompt = ""
think = false
max_handoffs = 3
max_tool_calls = 20

[agents.explorer]
prompt = ""
max_tool_calls = 20

[agents.fixer]
prompt = ""
think = false
max_attempts = 3
max_tool_calls = 20

[agents.verifier]
prompt = ""

# Run in order, first failure is reported back to the Fixer.
# Commands must be non-mutating checks: the harness does not restore side
# effects they leave behind, only the files the Fixer touched.
[[verify]]
cmd = "uv run ruff format --check ."
timeout = 120

[[verify]]
cmd = "uv run pytest -q"
timeout = 600

[[aspects]]
id = "comments"
prompt = "Look at the comments and find those that are out of sync or contain inconsistencies. Assume code is right."
files = ["src/**/*.py"]
max_issues_per_file = 2
